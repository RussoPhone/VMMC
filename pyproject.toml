[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vmmc"
version = "0.1.0"
description = "Visualizador de música com memória contextual"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "pygame>=2.6,<3",
    "sounddevice>=0.5,<1",
    "soundfile>=0.13,<1",
]

[project.scripts]
vmmc = "main:cli"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["audio", "geometry", "memory", "renderer", "state"]
